# Small example data for trying each pipeline: cehbio examples run <pipeline>
# Every file is checked against its sha256. in_repo: true files are in examples/ in this repository;
# the others are downloaded from their source when first used (their licence doesn't allow copying them here).
birds:
  about: Three 30 s recordings of common UK birds (Robin, Blackbird, Wren), cut from open recordings on GBIF / iNaturalist.
  run: []
  expect:
    min_detections: 1
    any_species:
    - Erithacus rubecula
    - Turdus merula
    - Troglodytes troglodytes
