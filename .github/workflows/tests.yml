name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The core only: the tests need no models, keys or GPU.
      - run: pip install -e ".[dev]"
      - run: pytest -q

  r-package:
    # The cehbio R package: reading report tables, charts, command building (no Python needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("jsonlite", "nanoparquet", "digest", "curl", "yaml", "ggplot2", "testthat", "knitr"))'
      - run: R CMD build --no-build-vignettes r
      # R CMD check runs the tests too; suggested packages (quarto, EntoInsights) aren't needed
      - run: _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual cehbio_*.tar.gz
      - if: failure()
        run: cat cehbio.Rcheck/00check.log || true

  r-matches-python:
    # R works on its own: report tables the same as Python's, and uploads to a stand-in upload service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: sudo apt-get update && sudo apt-get install -y libmagick++-dev libavfilter-dev
      - run: Rscript -e 'install.packages(c("jsonlite", "nanoparquet", "digest", "curl", "yaml", "magick", "av"))'
      - run: R CMD INSTALL r
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_r_matches_python.py tests/test_r_upload.py tests/test_r_videos.py
