name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The core only: the tests need no models, keys or GPU.
      - run: pip install -e ".[dev]"
      - run: pytest -q

  r-package:
    # The cehbio R package: reading report tables, charts, command building (no Python needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("jsonlite", "ggplot2", "testthat", "knitr"))'
      - run: R CMD INSTALL r
      - run: Rscript -e 'testthat::test_local("r", stop_on_failure = TRUE)'
