[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceh-biomonitoring"
version = "0.3.1"
description = "Biodiversity monitoring pipelines from UKCEH: birds (BirdNET or Perch), bats (BatDetect2) and moths/insects in light-trap images, on JASMIN, HPC or a laptop, plus uploading data to UKCEH."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UKCEH Biomonitoring" }]

# The core: what every pipeline needs (object store, chunking, Slurm, outputs).
# Minimum versions only, so people get the newest releases; each run records
# the exact versions it used in its summary file (see ceh_biomonitoring.provenance).
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "boto3>=1.34",
    "pyyaml>=6",
    "requests>=2.31",             # cehbio upload
]

[project.optional-dependencies]
# Install only what you need, e.g.  pip install -e ".[bats]"  or  ".[birds,bats]"
birds = [
    "birdnet-analyzer>=2.4",      # BirdNET (weights are CC BY-NC-SA: non-commercial only)
    "tensorflow>=2.21",           # also runs Perch (Apache 2.0, OK for commercial work)
    "kagglehub>=0.3",             # downloads the Perch model
    "librosa>=0.11",
    "soundfile>=0.13",
]
bats = [
    "batdetect2>=1.3",
    "soundfile>=0.13",
]
images = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",                  # moth / non-moth model
    "flat-bug>=1.2",              # insect detector (MIT)
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "matplotlib>=3.8",            # cehbio mask draw
]
validation = [                    # cehbio validate prepare: Mothbot packages, audio clips
    "torch>=2.2",
    "torchvision>=0.17",          # DINOv2 embeddings for clustering and screens
    "scikit-learn>=1.3",          # HDBSCAN
    "pillow>=10",
    "soundfile>=0.13",
    "matplotlib>=3.8",            # spectrograms of audio clips
]
reports = [                       # cehbio report: charts, and Word and PDF versions
    "matplotlib>=3.8",
]
videos = [                        # cehbio video, cehbio soundscape: .mp4 with sound
    "av>=12",                     # PyAV: ffmpeg's libraries inside Python (managed laptops block ffmpeg.exe)
    "pillow>=10",
    "matplotlib>=3.8",
    "soundfile>=0.13",
]
dev = [
    "pytest>=8",
    "av>=12",                     # video tests
    "soundfile>=0.13",
    "matplotlib>=3.8",
    "pillow>=10",                 # mask tests
]
all = [
    "ceh-biomonitoring[birds,bats,images,validation,reports,videos]",
]

[project.scripts]
cehbio = "ceh_biomonitoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ceh_biomonitoring = ["profiles/*.yml", "device_profiles/*.yml", "pipelines/images/*.yml", "examples.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
